services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: "3000"
      DB_PATH: "/data/pulse.db"
      CHECK_INTERVAL: "20"
    volumes:
      - pulse_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pulse_data:
